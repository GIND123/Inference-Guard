schema_version: session11_release_evidence_v1
release_id: session11_release_candidate

sources:
  model_manifest: artifacts/model_manifest.json
  compose_file: docker-compose.yml
  evaluation_runner: src/evaluation/run.py

roles:

  web_risk:
    manifest_role: risk_modernbert_web
    runtime:
      source: compose
      key: RISK_MODEL_ID

    evaluation_artifact:
      path: artifacts/risk_eval/inferenceguard-modernbert-risk_val_2026-11-18.json

    require_manifest_revision: true
    require_manifest_verified: true
    require_manifest_checksums: true
    require_evaluation_model_match: true
    require_usable_fitted_bands: true

  heldout_risk:
    manifest_role: risk_modernbert
    runtime:
      source: python_constant
      constant: DEFAULT_RISK_MODEL_ID

    evaluation_artifact:
      path: artifacts/risk_eval/inferenceguard-modernbert-risk_val_2026-11-18.json

    require_manifest_revision: true
    require_manifest_verified: true
    require_manifest_checksums: true
    require_evaluation_model_match: true
    require_usable_fitted_bands: true

  rewriter:
    manifest_role: rewriter
    runtime:
      source: compose
      key: REWRITER_MODEL_ID

    evaluation_artifact:
      path: reports/benchmark_50_results.json

    require_manifest_revision: true
    require_manifest_verified: true
    require_manifest_checksums: true
    require_evaluation_model_match: true
    require_reportable_evaluation: true

  heldout_adversary:
    expected_model_id: microsoft/Phi-4-mini-instruct
    runtime:
      source: python_constant
      constant: DEFAULT_ADVERSARY_MODEL_ID

    require_reportable_result: true
    reportable_result_artifact: reports/comparative_benchmark_test.json

output:
  evidence_file: artifacts/operations/session11_release_evidence.json
