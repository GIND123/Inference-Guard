experiment_id: session06_user_eval_v1
session: 6
experiment_type: user_evaluation
schema_version: session06_v2

dataset:
  name: RobinSta/SynthPAI
  revision: TBD
  split: validation

random_seed: 42

risk_model:
  name: ModernBERT-base
  checkpoint: artifacts/risk_model/best_model

rewriter:
  name: Qwen3-1.7B
  checkpoint: artifacts/rewriter_qlora

attacker:
  name: microsoft/Phi-4-mini-instruct

utility_evaluator:
  semantic_similarity_model: sentence-transformers/all-MiniLM-L6-v2
  nli_model: cross-encoder/nli-deberta-v3-large

protocol:
  name: session06_goal_driven_user_study
  zero_coaching: true
  synthetic_scenarios_only: true
  external_participants_only: true

user_study:
  participant_id_regex: '^P\d{2,}$'

  core_scenarios:
    - S-01
    - S-02
    - S-05

  optional_scenarios:
    - S-03
    - S-04
    - S-06

  scenario_modes:
    S-01: generative
    S-02: controlled
    S-03: generative
    S-04: generative
    S-05: controlled
    S-06: staged_multiturn

  valid_system_states:
    - risk_positive_rewrite
    - risk_positive_utility_conflict
    - risk_negative_passthrough

  valid_warning_comprehension:
    - correct
    - partial
    - incorrect
    - echo

  valid_rewrite_decisions:
    - accept_as_is
    - accept_with_edits
    - reject
    - not_applicable

  required_fields:
    - participant_id
    - scenario_id
    - scenario_mode
    - experiment_id
    - session
    - date
    - facilitator
    - artifact
    - anchors_available
    - anchors_used
    - initial_query
    - query_formulation_seconds
    - evaluator_intervention_pre_submit
    - detected_risk
    - risk_score
    - system_state
    - warning_in_their_words
    - warning_comprehension
    - requested_rewrite
    - rewrite_changed_text
    - rewrite_decision
    - usefulness
    - would_use_before_sending
    - adoption_reason
    - time_to_decision_seconds
    - comments

  conditional_fields:
    rewrite_edit:
      when:
        rewrite_decision: accept_with_edits
      require:
        - edit_made

    protocol_deviation:
      when:
        protocol_deviation: true
      require:
        - deviation_type
        - description

metrics:
  disclosure:
    - anchor_disclosure_rate

  detection:
    - detected_risk_rate
    - risk_score

  privacy:
    - risk_before
    - risk_after
    - privacy_risk_delta
    - attacker_success_rate

  utility:
    - cosine_similarity
    - nli_forward
    - nli_backward
    - contradiction

  usability:
    - comprehension_distribution
    - acceptance_rate
    - edit_rate
    - rejection_rate
    - adoption_rate
    - usefulness
    - query_formulation_seconds
    - time_to_decision_seconds

  reliability:
    - explicit_pii_failure_rate
    - risk_inversion_rate
    - rewrite_failure_rate
    - unnecessary_rewrite_rate
    - zero_risk_passthrough_rate
    - trust_calibration_failure_rate
    - protocol_deviation_rate

  multiturn:
    - turn_level_risk
    - cumulative_risk
    - cumulative_anchor_disclosure

failure_taxonomy:
  F01: explicit_pii_remains
  F02: inferential_risk_increases
  F03: utility_destroyed
  F04: hallucinated_content
  F05: false_negative
  F06: unnecessary_rewrite
  F07: user_misunderstood_warning
  F08: trust_calibration_failure

output:
  root: experiments/session06_user_eval_v1
  raw_dir: experiments/session06_user_eval_v1/raw
  derived_dir: experiments/session06_user_eval_v1/derived

validation:
  fail_on_missing_required_fields: true
  fail_on_invalid_scenario_id: true
  fail_on_invalid_scenario_mode: true
  fail_on_invalid_system_state: true
  fail_on_invalid_comprehension_label: true
  fail_on_invalid_rewrite_decision: true
  fail_on_invalid_score_range: true
  fail_on_negative_latency: true
  fail_on_session_mismatch: true
  fail_on_experiment_id_mismatch: true
  fail_on_anchor_subset_violation: true
  scan_for_possible_pii: true
